name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # setup-uv has no major-version tags since v8, so pin the full version.
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Build stubs for every dumped Nuke version
        run: |
          for dump in data/nuke/*/dump.json; do
            uv run python -m hoststubs build "$dump"
          done
      - name: Build one wheel per Nuke version
        run: |
          for package in build/nuke-*/package; do
            uv build --wheel "$package" --out-dir dist
          done
      - uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: dist/*.whl
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/nuke-python-stubs-*.zip --notes "See CHANGELOG.md."

  # Users on Windows found #7 and #9. Tests and the build gate only; releases come from `build`.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - run: uv run pytest -q
      - name: Build stubs for every dumped Nuke version
        run: |
          for dump in data/nuke/*/dump.json; do
            uv run python -m hoststubs build "$dump"
          done

  # A separate job, so only the upload step holds the PyPI token.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A tag can re-release versions already on PyPI; only new wheels upload.
          skip-existing: true
