name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Build stubs for every dumped Nuke version
        run: |
          for dump in data/nuke/*/dump.json; do
            uv run python -m hoststubs build "$dump"
          done
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/nuke-python-stubs-*.zip --notes "See CHANGELOG.md."
