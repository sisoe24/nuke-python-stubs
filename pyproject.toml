[project]
name = "hoststubs"
version = "0.4.0"
description = "Generate Python type stubs for Nuke and Hiero"
authors = [{ name = "virgilsisoe" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.6.2", "pyright==1.1.414"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hoststubs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["stubs", "tests/fixtures", "tests/corpus", "data", "src/hoststubs/hosts/*/overrides", "build"]

[tool.ruff.lint]
# Import order belongs to isort (length_sort), run by pre-commit.
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
# Tables of expected types read better on one line.
"tests/*" = ["E501"]

[tool.isort]
length_sort = true

[tool.autopep8]
max_line_length = 100
